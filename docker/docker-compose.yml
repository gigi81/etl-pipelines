# Started in Phase 4 (SERVER.md) with just postgres/nuget; Phase 5 adds server/agent themselves,
# on the plain dotnet SDK image with the repo bind-mounted rather than a purpose-built image -
# there is no Dockerfile.server/Dockerfile.agent yet, and there deliberately isn't one until Phase
# 7 ("Docker Compose hardening and image build"), which is what replaces this section with a real
# multi-stage build, adds health checks and restart policies, and seeds bagetter/deploys the
# schema automatically. Until then, this is what actually makes `docker compose up` bring up a
# working Server+Agent today rather than nothing at all.
services:
  postgres:
    image: postgres:15.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: etlpipelines_server
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # bagetter - the one NuGet-compatible feed every package install goes through (never straight to
  # nuget.org - see SERVER.md's "Package feed" decision). Starts with nothing installed and no
  # upstream configured; Phase 7's "Bagetter seeding" is what pushes the packed samples to it.
  nuget:
    image: bagetter/bagetter
    volumes:
      - nuget-data:/data

  server:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ../:/src
      - server-cache:/var/lib/etlpipelines/server-cache
    command: dotnet run --project src/EtlPipelines.Server --configuration Release
    depends_on:
      - postgres
      - nuget

  # Not yet running dbdeploy against `postgres` on its own - Phase 7's "Schema deployment on
  # startup" is what makes a fresh postgres-data volume take itself from empty to serving traffic;
  # until then, `dbdeploy deploy --path db` against this stack is a manual step.
  agent:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ../:/src
      - agent-cache:/var/lib/etlpipelines/agent-cache
    command: dotnet run --project src/EtlPipelines.Agent --configuration Release
    depends_on:
      - server

volumes:
  postgres-data:
  nuget-data:
  server-cache:
  agent-cache:
