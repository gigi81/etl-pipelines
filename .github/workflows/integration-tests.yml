name: Integration Tests
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  samples:
    name: Samples
    # Linux only: the samples are run against real SQL Server, PostgreSQL, MySQL and Oracle through
    # Testcontainers, and a Docker engine is only available on the Linux runners. Testcontainers talks
    # to the runner's own daemon, so no service containers are declared here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning computes the version from the commit height, so a shallow clone
          # gives it the wrong answer.
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # Every sample is executed end to end and checked against what it claims to produce. Samples are
      # documentation nothing compiles against, so without this they rot quietly.
      - name: Run the samples
        shell: bash
        run: >
          dotnet test tests/EtlPipelines.Samples.Tests/EtlPipelines.Samples.Tests.csproj
          --configuration Release --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-samples.trx"
          || true
      - name: Test report
        uses: dorny/test-reporter@v3.0.0
        if: always()
        with:
          name: sample-results
          path: "./TestResults/*-samples.trx"
          reporter: dotnet-trx
          fail-on-error: true
