name: Continuous Integration
on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning computes the version from the commit height, so a shallow clone
          # gives it the wrong answer.
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # TUnit runs on Microsoft.Testing.Platform (see global.json), so the report and coverage flags
      # are the platform's own (--report-trx / --coverage) rather than the VSTest ones
      # (--logger / --collect).
      #
      # A shared --results-directory is safe here: MTP puts the assembly name in the TRX filename, so
      # the collision that once forced a results directory per project cannot happen.
      #
      # shell: bash on every leg so that `|| true` means the same thing everywhere - under the
      # Windows default of pwsh there is no `true` command, so the step would fail anyway and the
      # reporter below would never get to render which test broke.
      #
      # The Docker category is excluded on every leg, Linux included. The container-backed tests are
      # run by the integration-tests workflow instead, on its own runner: running them here as well
      # meant two test assemblies each starting their own Oracle, SQL Server, PostgreSQL and MySQL at
      # the same time on one runner, and the second Oracle never finished opening its database
      # (ORA-01109). One workflow owning the containers keeps that from happening again.
      #
      # The Packaging category is excluded for a different reason: EtlPipelines.PipelinePackaging.Tests
      # spawns a real "dotnet pack" + "dotnet tool install" round trip per test, which would roughly
      # double this job's running time on every PR for a contract that changes rarely. It runs in its
      # own sequential step in integration-tests.yml instead, same as the Docker-tagged suites.
      #
      # Two exclusions, not one "Category!=Docker&Category!=Packaging" - empirically (confirmed against
      # this exact MTP version before landing this), a single bracket combining two conditions on the
      # same property crashes the filter parser outright, and combining two whole "/*/*/*/*[...]" node
      # paths with "&"/"|" is a set union of whatever each side matches, not an intersection - so
      # "Category!=Docker&Category!=Packaging" that way would still let a Packaging-tagged test through
      # (it satisfies "Category!=Docker" on its own). Negating each whole node path with a leading "!"
      # and "&"-ing those together is what actually intersects the two exclusions.
      #
      # --ignore-exit-code 8 is "zero tests ran". With the Docker/Packaging tests filtered out,
      # EtlPipelines.Extensions.Sql.Databases.Tests and EtlPipelines.PipelinePackaging.Tests both have
      # nothing left to run, which MTP reports as an error; it is the expected outcome here, not a
      # failure.
      - name: Run tests
        shell: bash
        run: >
          dotnet test --configuration Release --no-build
          --results-directory ./TestResults
          --treenode-filter "!/*/*/*/*[Category=Docker]&!/*/*/*/*[Category=Packaging]"
          --report-trx --report-trx-filename "{asm}-test-results.trx"
          --coverage --coverage-output-format cobertura
          --ignore-exit-code 8
          || true
      # One level, deliberately: the collector also drops a copy under TestResults/_<machine>/In/,
      # and a ** glob would upload every report twice.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Code coverage ${{ matrix.os }}
          path: "./TestResults/*.cobertura.xml"
      # One leg only. Codecov merges every report it is sent for a commit, and the three legs cover
      # the same lines, so uploading all of them would say nothing extra. The integration-tests
      # workflow uploads the container-backed half of the coverage against the same commit.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always() && runner.os == 'Linux'
        with:
          files: "./TestResults/*.cobertura.xml"
          token: ${{ secrets.CODECOV_TOKEN }}
      # Last, because this is the step that decides whether the job passes. Anything that has to
      # happen whatever the tests did - the artifact, the Codecov upload - is above it, where a
      # failing test cannot skip it.
      - name: Test report
        uses: dorny/test-reporter@v3.0.0
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "./TestResults/*-test-results.trx"
          reporter: dotnet-trx
          fail-on-error: true
  pack:
    name: Pack
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Create packages
        run: dotnet pack --configuration Release --output ./packages
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NuGet packages
          path: packages/*.*
  deploy:
    name: Deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The packages pushed are the ones the pack job already built and the test job already vetted,
      # rather than a fresh build made here that nothing has run against.
      - uses: actions/download-artifact@v8
        with:
          name: NuGet packages
          path: packages
      # Nerdbank.GitVersioning takes the version from version.json, not from the tag, so the two have
      # to agree: bump version.json in a PR first, then tag the merge commit. Without this check a
      # mismatched tag would silently publish whatever version.json happened to say.
      - name: Verify the tag matches version.json
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(jq -r .version version.json)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.json ($actual). Bump version.json to $expected on main and re-tag."
            exit 1
          fi
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Samples pack too (src/Samples.Build.props, PackAsTool), but they are demo/test fixtures, not
      # products - a same-prefix include glob can't tell them apart from a real connector, since both
      # share the "EtlPipelines." prefix (samples are "EtlPipelines.Samples.*"), so this excludes them
      # by name explicitly rather than narrowing the glob.
      - name: Push packages
        shell: bash
        run: |
          shopt -s nullglob
          for pkg in packages/*.nupkg; do
            case "$(basename "$pkg")" in
              EtlPipelines.Samples.*) echo "Skipping sample package $(basename "$pkg")"; continue ;;
            esac
            dotnet nuget push "$pkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generateReleaseNotes: true
