name: Documentation
on:
  push:
    branches:
      - main
      - 'feature/**'
    # The inverse of ci.yml's own paths-ignore: that workflow skips a Markdown-only change, this one
    # exists for exactly that change. The API reference is generated from the sources' XML docs too,
    # but the compiler already fails the build on a malformed or missing doc comment
    # (GenerateDocumentationFile + TreatWarningsAsErrors), so ci.yml is what guards that side.
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
# Same reasoning as ci.yml's own concurrency block.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: DocFX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # docfx's metadata step builds the documented projects, and Nerdbank.GitVersioning needs
          # the full history to compute a version while it does - same as every other workflow.
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      # --warningsAsErrors turns a broken cross-reference or a link to a missing page into a failed
      # build rather than a silently dead link on the published site. Nothing is uploaded: the site
      # is small to rebuild, and artifact storage is the one Actions quota this repository has
      # actually run out of.
      - name: Build documentation
        run: dotnet docfx docs/docfx.json --warningsAsErrors
