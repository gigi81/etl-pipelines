# Finished in Phase 7 (SERVER.md "Docker Compose hardening and image build") - real, published
# images (Dockerfile.server/Dockerfile.agent) instead of the plain SDK-image-plus-bind-mount
# `dotnet run` this file used through Phase 6, health checks so `depends_on` actually waits for a
# usable dependency rather than merely a started container, restart policies, and a one-shot
# `seed` step so a first-run stack comes up with the six samples already installable in bagetter.
#
# postgres:15.1, not the postgres:18 SERVER.md's own Phase 7 sketch names - kept at the exact
# version already pinned everywhere else this repo actually runs Postgres (db.yml's own CI
# service container, DatabaseFixture in both Server.Tests and Server.Database.Tests) rather than
# introducing a fourth, untested one.
services:
  postgres:
    image: postgres:15.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: etlpipelines_server
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # bagetter - the one NuGet-compatible feed every package install goes through (never straight
  # to nuget.org - see SERVER.md's "Package feed" decision). No committed healthcheck here (see
  # docker/seed.sh's own comment for why) - depends_on below stays condition: service_started,
  # not healthy.
  nuget:
    image: bagetter/bagetter
    volumes:
      - nuget-data:/data
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
      nuget:
        condition: service_started
    volumes:
      - server-cache:/var/lib/etlpipelines/server-cache
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - agent-cache:/var/lib/etlpipelines/agent-cache
    restart: unless-stopped

  # One-shot: packs and pushes the six samples once, then exits - never restarted (a second run
  # against an already-seeded bagetter would just re-push the same versions harmlessly, but
  # there is nothing to gain from doing that on every `docker compose up`).
  seed:
    build:
      context: ..
      dockerfile: docker/Dockerfile.seed
    depends_on:
      nuget:
        condition: service_started
    restart: "no"

# server-cache also holds the Data Protection key ring (KeyRing:Path) - it must be a durable
# volume, since losing it makes every encrypted ConfigurationEntries.EncryptedValue unrecoverable.
volumes:
  postgres-data:
  nuget-data:
  server-cache:
  agent-cache:
