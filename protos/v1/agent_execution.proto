syntax = "proto3";

package etlpipelines.agent_execution.v1;

option csharp_namespace = "EtlPipelines.AgentExecution.V1";

// Consumed by EtlPipelines.Agent.GrpcClient - the agent's own infrastructure, a separate
// process/machine the operator runs, never an arbitrary third-party pipeline process (that
// narrower, less-trusted surface is pipeline_execution.v1.PipelineExecutionService).
service AgentService {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc Heartbeat(AgentHeartbeatRequest) returns (Ack);
  // Held open for the agent's whole lifetime so the server can push work rather than the agent
  // polling for it (Phase 5's AgentRegistration, a BackgroundService holding this stream open).
  rpc Subscribe(SubscribeRequest) returns (stream WorkItem);
  rpc ReportInstallResult(ReportInstallResultRequest) returns (Ack);
  rpc ReportExecutionStatus(ReportExecutionStatusRequest) returns (Ack);
}

message RegisterAgentRequest {
  string machine_name = 1;
  repeated string tags = 2;
  string version = 3;
}

message RegisterAgentResponse {
  // Server-issued; every later call from this agent (Heartbeat, Subscribe, both Report* RPCs)
  // carries it back. Mirrors Agents.Id (Phase 3).
  string agent_id = 1;
}

message AgentHeartbeatRequest {
  string agent_id = 1;
}

message SubscribeRequest {
  string agent_id = 1;
}

// Exactly one of install_package/execute_pipeline is set - the two work item kinds this service's
// own summary above and Phase 5/6 describe ("InstallPackage | ExecutePipeline").
message WorkItem {
  string work_item_id = 1;

  oneof kind {
    InstallPackageWorkItem install_package = 2;
    ExecutePipelineWorkItem execute_pipeline = 3;
  }
}

message InstallPackageWorkItem {
  string package_id = 1;
  string version = 2;
  // The `--add-source` argument(s) for `dotnet tool install` - the agent has no database access
  // of its own (by design), so the server hands over whatever NuGetFeeds currently holds at
  // dispatch time rather than the agent reading a possibly-stale local copy of the same URL.
  repeated string feed_urls = 3;
}

message ExecutePipelineWorkItem {
  // The session id this run's process authenticates back to PipelineExecutionService with -
  // minted by the server before this work item is sent, so agent and process agree on it without
  // negotiating.
  string session_id = 1;
  string package_id = 2;
  string package_version = 3;
  string pipeline_name = 4;
  // Where the launched process's EtlPipelines.GrpcClient calls back to - not necessarily this
  // same AgentService endpoint (Phase 6's --server-url).
  string server_url = 5;
}

message ReportInstallResultRequest {
  string agent_id = 1;
  string work_item_id = 2;
  bool succeeded = 3;
  // The pipeline names the installed package reports via its own `list` verb - what
  // ManagementService.ListInstalledPipelines ultimately reads back (Phase 5). Empty when
  // succeeded is false.
  repeated string pipeline_names = 4;
  // Empty when succeeded is true.
  string error = 5;
}

message ReportExecutionStatusRequest {
  string agent_id = 1;
  string session_id = 2;
  Status status = 3;
  // Only meaningful when status == EXITED.
  int32 exit_code = 4;
  // Only meaningful when status == RESOURCE_SAMPLE - mirrors AgentResourceSamples (Phase 8),
  // sampled by Phase 5's ResourceMonitor off Process.TotalProcessorTime/WorkingSet64.
  double cpu_percent = 5;
  int64 working_set_bytes = 6;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STARTED = 1;
    EXITED = 2;
    RESOURCE_SAMPLE = 3;
  }
}

message Ack {}
