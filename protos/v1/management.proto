syntax = "proto3";

package etlpipelines.management.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "EtlPipelines.Management.V1";

// The end-user/API surface. No auth in phase 1 - see SERVER.md's "Decisions already made": the
// whole stack is not safe to expose beyond a trusted network until a later phase adds it.
service ManagementService {
  rpc ListInstalledPipelines(Empty) returns (ListInstalledPipelinesResponse);
  rpc ListAvailablePackages(ListAvailablePackagesRequest) returns (ListAvailablePackagesResponse);
  rpc ListUpdates(Empty) returns (ListUpdatesResponse);
  rpc InstallPackage(InstallPackageRequest) returns (InstallPackageResponse);
  rpc UninstallPackage(UninstallPackageRequest) returns (Ack);
  rpc UpdatePackage(UpdatePackageRequest) returns (UpdatePackageResponse);
  // Returns a run id immediately; the run itself happens asynchronously on whichever agent it's
  // dispatched to - poll or stream StreamRunProgress for the outcome.
  rpc ExecutePipeline(ExecutePipelineRequest) returns (ExecutePipelineResponse);
  rpc StreamRunProgress(StreamRunProgressRequest) returns (stream RunProgressEvent);
  rpc ListAgents(Empty) returns (ListAgentsResponse);
  rpc SetConfigurationEntry(SetConfigurationEntryRequest) returns (Ack);
}

message Empty {}
message Ack {}

// Mirrors Pipelines joined to PackageVersions/Packages (Phase 3) - one row per nameable pipeline,
// not per package, since one package can register more than one (EtlPipelines.Samples.
// ArchiveToDatabase's own build-feed/archive split is the proof this needs pipeline-name
// granularity, not just package granularity).
message InstalledPipeline {
  string pipeline_id = 1;
  string name = 2;
  string package_id = 3;
  string package_version = 4;
}

message ListInstalledPipelinesResponse {
  repeated InstalledPipeline pipelines = 1;
}

message ListAvailablePackagesRequest {
  // Empty matches every package the feed (always bagetter - see "Decisions already made") holds;
  // set to filter, the same way a NuGet search box does.
  string search_term = 1;
}

message AvailablePackage {
  string package_id = 1;
  repeated string versions = 2;
}

message ListAvailablePackagesResponse {
  repeated AvailablePackage packages = 1;
}

message PackageUpdate {
  string package_id = 1;
  string installed_version = 2;
  string latest_version = 3;
}

message ListUpdatesResponse {
  repeated PackageUpdate updates = 1;
}

message InstallPackageRequest {
  string package_id = 1;
  // Empty resolves to the latest stable version bagetter reports - the same default "Other gaps
  // worth stating" describes for UpdatePackage; set explicitly to pin a version.
  string version = 2;
}

message InstallPackageResponse {
  string package_version_id = 1;
  string version = 2;
  repeated string pipeline_names = 3;
}

message UninstallPackageRequest {
  string package_id = 1;
}

message UpdatePackageRequest {
  string package_id = 1;
}

message UpdatePackageResponse {
  string package_version_id = 1;
  string version = 2;
  repeated string pipeline_names = 3;
}

message ExecutePipelineRequest {
  string pipeline_id = 1;
}

message ExecutePipelineResponse {
  // Mirrors Runs.Id (Phase 3) - the same value that becomes the launched process's session_id
  // (pipeline_execution.v1's own field of that name).
  string run_id = 1;
}

message StreamRunProgressRequest {
  string run_id = 1;
}

// One event per stage completing, plus a final one when the run itself completes - mirrors
// StageResults/Runs (Phase 3).
message RunProgressEvent {
  string run_id = 1;

  oneof event {
    StageCompleted stage_completed = 2;
    RunCompleted run_completed = 3;
  }
}

message StageCompleted {
  int32 sequence = 1;
  string name = 2;
  int64 rows_in = 3;
  int64 rows_out = 4;
  int64 rows_failed = 5;
  int64 elapsed_ms = 6;
  string error_code = 7;
  string error_description = 8;
}

message RunCompleted {
  Status status = 1;
  int32 exit_code = 2;
  int64 rows_read = 3;
  int64 rows_written = 4;
  int64 rows_failed = 5;

  // Mirrors Runs.Status (Phase 3) in full - the server's own view of a run, as opposed to
  // pipeline_execution.v1.ReportRunResultRequest.Outcome, which only carries the two outcomes a
  // pipeline process can report about itself. Includes every state Phase 8's reliability work
  // assigns from outside the process (AGENT_LOST included).
  enum Status {
    STATUS_UNSPECIFIED = 0;
    QUEUED = 1;
    DISPATCHED = 2;
    RUNNING = 3;
    SUCCEEDED = 4;
    FAILED = 5;
    AGENT_LOST = 6;
  }
}

message AgentInfo {
  string agent_id = 1;
  string machine_name = 2;
  repeated string tags = 3;
  string version = 4;
  Status status = 5;
  google.protobuf.Timestamp last_heartbeat_at = 6;

  // Mirrors Agents.Status (Phase 3); Phase 8 is what actually flips an agent to OFFLINE, after N
  // missed heartbeats.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    ONLINE = 1;
    OFFLINE = 2;
  }
}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message SetConfigurationEntryRequest {
  // Colon-path, e.g. "ConnectionStrings:sales" - mirrors ConfigurationEntries.Key (Phase 3).
  string key = 1;
  // Encrypted at rest via IDataProtector before this reaches ConfigurationEntries.EncryptedValue
  // (Phase 4's SecretsStore) - never stored or logged as given.
  string value = 2;
}
