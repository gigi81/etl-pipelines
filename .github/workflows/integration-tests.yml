name: Integration Tests
on:
  push:
    branches:
      - main
      - 'feature/**'
    # Nothing under here is .NET code or a db/ script this workflow's own suites touch - docker/**
    # and docker.yml have their own workflow, and a docs-only change compiles nothing.
    paths-ignore:
      - 'docker/**'
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docker/**'
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - '**/*.md'
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  databases:
    name: Databases
    # Linux only: these tests run against real SQL Server, PostgreSQL, MySQL and Oracle through
    # Testcontainers, and a Docker engine is only available on the Linux runners. Testcontainers talks
    # to the runner's own daemon, so no service containers are declared here.
    #
    # This workflow owns every Docker-backed test in the repository. The CI workflow filters them out
    # on all three of its legs, so a commit never has two runners - or worse, two test assemblies on
    # one runner - starting the same four database engines at once.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning computes the version from the commit height, so a shallow clone
          # gives it the wrong answer.
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # db's schema is owned by dbdeploy, never `dotnet ef migrations` - see SERVER.md's "Database
      # schema management" decision. Installed here, ahead of every step below that needs it
      # (both ServerDatabaseDockerTests and ManagementServiceDockerTests shell out to it), the
      # same documented way an operator installs it (`dotnet tool install --global dbdeploy`)
      # rather than a PackageReference.
      - name: Install dbdeploy
        run: |
          dotnet tool install --global dbdeploy
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # First, and fast: a single atmoz/sftp container, nothing near the size of the database steps
      # below. Kept in this workflow rather than the CI one for the same reason every other
      # Docker-backed test is - the CI workflow filters Category=Docker out on all three of its legs.
      - name: File servers
        shell: bash
        run: >
          dotnet test tests/EtlPipelines.Extensions.Files.Servers.Tests/EtlPipelines.Extensions.Files.Servers.Tests.csproj
          --configuration Release --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-integration.trx"
          --coverage --coverage-output-format cobertura
          || true
      # One project at a time, deliberately. Both projects start their own Oracle, SQL Server,
      # PostgreSQL and MySQL, and `dotnet test` runs test assemblies in parallel: run together, the
      # runner ends up hosting two of each engine and the second Oracle never finishes opening its
      # database (ORA-01109: database not open). Sequential steps mean at most one set is ever up.
      - name: Bulk loaders against every engine
        shell: bash
        run: >
          dotnet test tests/EtlPipelines.Extensions.Sql.Databases.Tests/EtlPipelines.Extensions.Sql.Databases.Tests.csproj
          --configuration Release --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-integration.trx"
          --coverage --coverage-output-format cobertura
          || true
      # Runs dbdeploy deploy against a genuinely empty, Testcontainers-managed Postgres, then reads
      # and writes through ServerDbContext against the schema it just created - the one test that
      # proves db/server/_Init.sql and EF Core's scaffolded mapping actually agree, not merely that
      # each is individually well-formed. dbdeploy's own CLI contract (validate/deploy/ci against a
      # plain Postgres, not one this project's code touches) is exercised separately, in db.yml.
      - name: Server.Database
        shell: bash
        run: >
          dotnet test tests/EtlPipelines.Server.Database.Tests/EtlPipelines.Server.Database.Tests.csproj
          --configuration Release --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-integration.trx"
          --coverage --coverage-output-format cobertura
          || true
      # The full ManagementService surface Phase 4 (SERVER.md) implements, against its own
      # Testcontainers-managed Postgres (deployed via dbdeploy once per run - see
      # ManagementServiceDockerTests) - a different container from the "Server.Database" step
      # above, proving the gRPC service layer agrees with a real database, not just
      # EtlPipelines.Server.Database's own mapping in isolation.
      - name: Server
        shell: bash
        run: >
          dotnet test tests/EtlPipelines.Server.Tests/EtlPipelines.Server.Tests.csproj
          --configuration Release --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-integration.trx"
          --coverage --coverage-output-format cobertura
          || true
      # Every sample is executed end to end and checked against what it claims to produce. Samples are
      # documentation nothing compiles against, so without this they rot quietly. Here they are run
      # against the real engines; the CI workflow runs the same samples against SQLite.
      - name: Samples against every engine
        shell: bash
        run: >
          dotnet test tests/EtlPipelines.Samples.Tests/EtlPipelines.Samples.Tests.csproj
          --configuration Release --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-integration.trx"
          --coverage --coverage-output-format cobertura
          || true
      # A real "dotnet pack" + "dotnet tool install" round trip, proving SERVER.md Phase 1's actual
      # contract: that a sample survives being packed and installed as a real dotnet tool, not just run
      # in-process. Needs no Docker, but it is slow (two MSBuild/NuGet round trips) for the same reason
      # the Docker-backed suites above get their own step rather than running on every fast per-PR leg
      # of ci.yml.
      - name: Pipeline packaging
        shell: bash
        run: >
          dotnet test tests/EtlPipelines.PipelinePackaging.Tests/EtlPipelines.PipelinePackaging.Tests.csproj
          --configuration Release --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-integration.trx"
          --coverage --coverage-output-format cobertura
          || true
      # Codecov merges every report it receives for a commit, so this half - the code only the
      # container-backed tests reach - lands alongside what the CI workflow uploads.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: "./TestResults/*.cobertura.xml"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Test report
        uses: dorny/test-reporter@v3.0.0
        if: always()
        with:
          name: integration-results
          path: "./TestResults/*-integration.trx"
          reporter: dotnet-trx
          fail-on-error: true
