name: Docker Compose
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compose:
    name: docker compose build/up
    # Linux only, same reasoning as integration-tests.yml's own "Databases" job - a Docker engine
    # is only available on the Linux runners.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Every image built below runs `dotnet publish`/`dotnet pack` inside its own build
          # stage, and Nerdbank.GitVersioning computes the version from the commit height - a
          # shallow clone fails that outright ("GitException: Shallow clone lacks the objects
          # required to calculate version height"), not merely with the wrong version, same
          # reasoning as every other workflow's own fetch-depth: 0.
          fetch-depth: 0
      # Plain `docker build`, not `docker compose build`/`up --build` - confirmed the hard way,
      # by two real runs of this exact workflow, that `docker compose build` (batched across all
      # three services, and even called for "seed" alone on its own) intermittently fails to read
      # Dockerfile.seed off disk at all ("failed to solve: failed to read dockerfile: open
      # Dockerfile.seed: no such file or directory", "transferring dockerfile: 2B" - a couple of
      # bytes, not this file's real ~1.2kB), despite that exact path resolving correctly every
      # time through `docker compose build --print`. Root cause not fully pinned down (the file on
      # disk is unremarkable - plain ASCII, LF line endings, no BOM - and it recurred as the third
      # build in a sequence where the first two, structurally identical builds each succeeded), but
      # it is specific to the bake-definition-over-stdin path `docker compose build` always goes
      # through, one way or another - so this sidesteps that whole mechanism rather than continuing
      # to guess at it. Every image tag matches exactly what compose's own `<project>-<service>`
      # naming would produce (confirmed against this workflow's own successful build logs:
      # "naming to docker.io/library/docker-server") - `docker compose up` below, with no --build
      # of its own, finds each image already built under the tag it would otherwise have built
      # itself and uses it as-is.
      - name: Build server image
        run: docker build --file docker/Dockerfile.server --tag docker-server:latest .
      - name: Build agent image
        run: docker build --file docker/Dockerfile.agent --tag docker-agent:latest .
      - name: Build seed image
        run: docker build --file docker/Dockerfile.seed --tag docker-seed:latest .
      # SERVER.md's own Phase 7 verification bullet, run for real: "docker compose up --build
      # against a genuinely fresh set of volumes, all four containers healthy" - a runner always
      # starts with none, so every run here already is that (images are already built by the
      # three steps above, so no --build here). --wait blocks until every service with a
      # healthcheck (postgres, server) reports healthy and every one-shot service (seed) exits,
      # failing the step outright if any of them doesn't - schema deployment (server's own
      # entrypoint runs `dbdeploy deploy` before the app itself ever starts, so a failed deploy
      # means server never reports healthy at all) and bagetter seeding (seed's own exit code) are
      # both proven by this one command succeeding, not asserted separately.
      - name: docker compose up
        working-directory: docker
        run: docker compose up --wait --wait-timeout 600
      - name: docker compose ps
        if: always()
        working-directory: docker
        run: docker compose ps -a
      - name: docker compose logs
        if: failure()
        working-directory: docker
        run: docker compose logs
      - name: docker compose down
        if: always()
        working-directory: docker
        run: docker compose down --volumes
