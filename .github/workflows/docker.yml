name: Docker Compose
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compose:
    name: docker compose build/up
    # Linux only, same reasoning as integration-tests.yml's own "Databases" job - a Docker engine
    # is only available on the Linux runners.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Every image built below runs `dotnet publish`/`dotnet pack` inside its own build
          # stage, and Nerdbank.GitVersioning computes the version from the commit height - a
          # shallow clone fails that outright ("GitException: Shallow clone lacks the objects
          # required to calculate version height"), not merely with the wrong version, same
          # reasoning as every other workflow's own fetch-depth: 0.
          fetch-depth: 0
      # One service at a time, deliberately - not `docker compose build` (equivalent to `up
      # --build`'s own implicit build step) with no arguments. That compiles every build-enabled
      # service into a single batched `buildx bake` call, and - confirmed the hard way, by a real
      # run of this exact workflow - bake's own handling of three targets sharing one identical
      # context (`..`, the whole repository - every one of these three needs the full solution
      # for its own ProjectReferences) can corrupt which Dockerfile one of them actually reads
      # ("failed to solve: failed to read dockerfile: open Dockerfile.seed: no such file or
      # directory", despite that exact path resolving correctly on its own - see
      # `docker compose build --print seed` versus `docker compose build --print`). Building each
      # service through its own, independent single-target bake call sidesteps that entirely.
      - name: Build server image
        working-directory: docker
        run: docker compose build server
      - name: Build agent image
        working-directory: docker
        run: docker compose build agent
      - name: Build seed image
        working-directory: docker
        run: docker compose build seed
      # SERVER.md's own Phase 7 verification bullet, run for real: "docker compose up --build
      # against a genuinely fresh set of volumes, all four containers healthy" - a runner always
      # starts with none, so every run here already is that (images are already built by the
      # three steps above, so no --build here). --wait blocks until every service with a
      # healthcheck (postgres, server) reports healthy and every one-shot service (seed) exits,
      # failing the step outright if any of them doesn't - schema deployment (server's own
      # entrypoint runs `dbdeploy deploy` before the app itself ever starts, so a failed deploy
      # means server never reports healthy at all) and bagetter seeding (seed's own exit code) are
      # both proven by this one command succeeding, not asserted separately.
      - name: docker compose up
        working-directory: docker
        run: docker compose up --wait --wait-timeout 600
      - name: docker compose ps
        if: always()
        working-directory: docker
        run: docker compose ps -a
      - name: docker compose logs
        if: failure()
        working-directory: docker
        run: docker compose logs
      - name: docker compose down
        if: always()
        working-directory: docker
        run: docker compose down --volumes
